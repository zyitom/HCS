# ---------------------------------------------------------------------------
# 机器配置：AD600（i7-1260P，4 个 P 核 8 线程 + 8 个 E 核，PREEMPT_RT）。
#
#   ros2 launch hcs_bringup hcs.launch.py robot:=balance-infantry machine:=ad600
#
# 超线程兄弟是相邻编号 (0,1) (2,3) (4,5) (6,7)，与 TL101（3 和 7 是一对）不同。内核
# cmdline 隔离两个整物理 P 核：isolcpus=2,3,6,7 nohz_full=2,3,6,7 rcu_nocbs=2,3,6,7
# irqaffinity=0,1,4,5（2026-10-03 起另隔离了 E 核簇 12-15，只为对比实时线程放 P 核和
# 放 E 核，结论出来后去留再定）。这样机器人 yaml 里写死的核号不用改：控制线程与发送线程在 3、
# 板卡 IO 线程在 7，各占一个物理核，兄弟 2、6 空着不放任何东西；中断默认只落在
# 非隔离的 P 核 0/1/4/5（xHCI 中断线程落到 E 核要赔约 21 us 的 p50，HOST_TUNING 2.2）；
# xHCI 中断再由 /etc/default/hcs_rt_tune 的 XHCI_IRQ_CPU=1 钉在 cpu1（落 cpu5 时 p99.9 差
# 30-50 us，HOST_TUNING 12.9）。
# 开机调优（RT 限流、governor、C1E、xHCI 中断线程 FIFO 90、把中断请出隔离核）由
# hcs_bringup/tools/hcs_rt_tune.service 落地。
#
# 尽力域线程只放非隔离核；E 核也算，它们不碰实时路径。
# ---------------------------------------------------------------------------
hcs_executor:
  ros__parameters:
    thread_config: "name=hcs-ctrl;policy=fifo;priority=90;cpus=3"
    realtime_config: "mlock=on;malloc=on;timer_slack=1us;prefault_stack=512K;prefault_heap=4M"
    reporter_thread_config: "name=hcs-report;policy=other;nice=5;cpus=0-1,4-5,8-15"
    spin_thread_config: "name=hcs-spin;policy=other;nice=5;cpus=0-1,4-5,8-15"
    # 有 Critical 级机器问题（RT 限流没关、xHCI 中断线程掉回 FIFO 50……）就拒绝启动。
    # 临时要在没调优的机器上跑：machine_guard: "warn"。
    machine_guard: "enforce"
