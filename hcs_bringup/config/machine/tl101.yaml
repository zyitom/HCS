# ---------------------------------------------------------------------------
# 机器配置：TL101（i7-1165G7，4 核 8 线程，PREEMPT_RT，cmdline 带 isolcpus=3,7；
# 3 和 7 是同一物理核的两个超线程）。
#
#   ros2 launch hcs_bringup hcs.launch.py robot:=balance-infantry            # 默认 machine:=tl101
#   ros2 launch hcs_bringup hcs.launch.py robot:=balance-infantry machine:=none   # 不加载机器配置
#
# launch 先加载本文件、再加载机器人 yaml：机器人 yaml 里写了同名键就以机器人为准。
# 这里只放 executor 这一层的机器事实（控制线程的核号与优先级、实时武装、两条尽力域线程）；
# 各组件自己的线程（发送线程 tx_thread_config、板卡 IO 线程的核号与优先级）挂在组件实例名下，
# 和具体机器人绑定，仍写在机器人 yaml 里 —— 换机器时那几行也要跟着改。
#
# 核号是机器事实，抄错了比不配还差。实测依据见 hcs_link.yaml 的注释和下面这张表。
#
# 控制线程的实时化旋钮各值多少（本机，1 kHz，start_late；当时 cmdline 是 isolcpus=7，
# 隔离核写的是 7。原记在已删除的 demo.yaml 里）：
#
#   thread_config              p50     p99     max      跳拍
#   （空）                      37 us   50 us   459 us   0/20021
#   cpus=3                      5 us  208 us  3559 us   27/15017   <- 绑到普通核，最差
#   cpus=7（隔离核）             4 us   11 us    18 us   0/25028
#   fifo:90 + mlock + pmqos     2 us    6 us    13 us   0/30027
#   cyclictest 基线（满负载）     2 us    -      21 us            <- 机器地板
#
# 也就是说：绑核那一下值 441 us，其余全部旋钮加起来值 5 us。先绑核。
# policy=fifo 要 rtprio、mlock 要 memlock 限额（/etc/security/limits.d/30-hcs.conf 里给
# rtprio 95、memlock unlimited）；cpu_dma_latency 要 CAP_SYS_ADMIN。
# ---------------------------------------------------------------------------
hcs_executor:
  ros__parameters:
    thread_config: "name=hcs-ctrl;policy=fifo;priority=90;cpus=3"
    realtime_config: "mlock=on;malloc=on;timer_slack=1us;prefault_stack=512K;prefault_heap=4M"
    reporter_thread_config: "name=hcs-report;policy=other;nice=5;cpus=0-2,4-6"
    spin_thread_config: "name=hcs-spin;policy=other;nice=5;cpus=0-2,4-6"
    # 有 Critical 级机器问题（RT 限流没关、xHCI 中断线程掉回 FIFO 50……）就拒绝启动。
    # 临时要在没调优的机器上跑：machine_guard: "warn"。
    machine_guard: "enforce"
